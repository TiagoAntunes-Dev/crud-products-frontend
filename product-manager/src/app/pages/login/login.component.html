<div class="auth-container">
  <div class="auth-card mat-elevation-z4">
    <div class="auth-header">
      <mat-icon class="auth-logo">inventory_2</mat-icon>
      <h1>ProductManager</h1>
      <p>Entre na sua conta para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" placeholder="seu@email.com" />
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="email.hasError('required') && email.touched">E-mail é obrigatório</mat-error>
        <mat-error *ngIf="email.hasError('email') && email.touched">E-mail inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="password.hasError('required') && password.touched">Senha é obrigatória</mat-error>
        <mat-error *ngIf="password.hasError('minlength') && password.touched">Mínimo 6 caracteres</mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="full-width submit-btn"
        [disabled]="form.invalid || loading"
      >
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <ng-container *ngIf="!loading">
          <mat-icon>login</mat-icon>
          <span>ENTRAR</span>
        </ng-container>
      </button>
    </form>

    <p class="auth-footer">
      Não tem conta?
      <a routerLink="/register">Criar conta</a>
    </p>
  </div>
</div>
