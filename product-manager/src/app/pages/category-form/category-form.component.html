<div class="content-container">
  <div class="form-header">
    <h2>🏷️ Nova Categoria</h2>
    <p>
      Categorias organizam seus produtos. Campos com <span class="required-star">*</span> são
      obrigatórios.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="cat-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome da Categoria *</mat-label>
      <input matInput formControlName="name" placeholder="Ex: Doces, Salgados, Bebidas..." />
      <mat-icon matSuffix>label</mat-icon>
      <mat-error *ngIf="name.hasError('required') && name.touched">Nome é obrigatório</mat-error>
      <mat-error *ngIf="name.hasError('minlength') && name.touched">Mínimo 2 caracteres</mat-error>
      <mat-error *ngIf="name.hasError('maxlength') && name.touched">Máximo 40 caracteres</mat-error>
      <mat-hint align="end">{{ charName }}/40</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição (opcional)</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="3"
        placeholder="Ex: Produtos com alto teor de açúcar, sobremesas e guloseimas."
      ></textarea>
      <mat-error *ngIf="description.hasError('maxlength') && description.touched">Máximo 120 caracteres</mat-error>
      <mat-hint align="end">{{ charDesc }}/120</mat-hint>
    </mat-form-field>

    <div class="form-actions">
      <button mat-stroked-button type="button" (click)="cancelar()">
        <mat-icon>arrow_back</mat-icon> Cancelar
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <ng-container *ngIf="!loading">
          <mat-icon>save</mat-icon>
          <span>CRIAR CATEGORIA</span>
        </ng-container>
      </button>
    </div>
  </form>
</div>
